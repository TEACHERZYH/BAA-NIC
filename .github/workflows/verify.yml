name: verify

on:
  push:
  pull_request:

jobs:
  compact-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source files
        run: python -m compileall -q models scripts
      - name: Verify frozen evidence
        run: python scripts/verify_published_results.py
